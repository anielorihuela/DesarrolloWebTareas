<!DOCTYPE html>
<html lang="es"> <!--lang="es" es para especificar idioma-->
    <head> <!-- crea head y body de manera "separada"-->
        <meta charset="UTF-8"/> <!--charset es para especificar el tipo de caracteres que usaremos-->
        <title>Mi primera página web</title>
        <!--para estilizar la página-->
        <!--si eg decimos que p tenga un cierto color, cualquier p que pongamos en el body tendrá ese color-->
        <style> 
            body{
                background-color: rgb(156, 236, 231);
            }
            h1{
                color:bisque;
                background-color: black;
            }
            p{
                color: palevioletred;
            }
            <!---->
            .fondo-amarillo{
                background-color: darkkhaki;
            }
        </style>
    </head>
    <body>
        <div> <!-- permite hacer bloques de tal forma que el estilo del bloque se aplique a todo lo que está dentro-->
            <h1 class="fondo-amarillo">Hello world</h1>
            <a href="https://itam.mx" > ITAM </a> <!--Así se añaden links-->
            <p>Esta es mi <br> primera página web</p> <!--br da un salto de línea-->
        </div>
        <hr/>
        <div>
            <h2>Colmillo ITAM</h2>
            <img src=“colmillo1.jpg” alt="colmillo, la mascota del ITAM"/>
            <h2>comidas favoritas</h2>
            <ul> <!--bullet points-->
                <li>lasaña</li>
                <li>pastel de red velvet</li>
            </ul>
            <h2>Series favoritas</h2>
            <ol> <!--lista ordenada-->
                <li>Brooklyn 99</li>
                <li>Arcane</li>
                <li>The office</li>
            </ol>
        </div>
        
    </body>
</html>
