<!DOCTYPE html>
<html lang="es">
    <head> <!-- crea head y body de manera "separada"-->
        <meta charset="UTF-8"/> <!--charset es para especificar el tipo de caracteres que usaremos-->
        <title>Práctica</title>
        <style>
            .fondo-div1{
                background-color: rgb(165, 163, 250);
                font-weight: bold;
            }
            select{
                box-shadow: 2px 2px blueviolet;
            }
            .fondo-div2{
                background-color: rgb(35, 138, 138);
                text-shadow: 2px 2px blueviolet;
                color:bisque
            }
            .tamano-div2{
                width: 10;
                height: 10;
                /*float: right;*/
                display: inline-block;
            }
            .margen-der-div2{
                margin-right: 1000px;
            }
            .margen-izq{
                margin-left: 500px;
            }
            .margen-der{
                margin-right: 500px;
            }
        </style>
    </head>
    <body>
        <div class="fondo-div1 margen-izq margen-der">
        <table border="1">
            <caption> Personality chart </caption>
        <thead>
            <tr>
                <th>INFJ</th>
                <th>ENTP</th>
                <th>ENFJ</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Personaje A</td>
                <td>Personaje B</td>
                <td>Personaje C</td>
            </tr>
            <tr>
                <td>Personaje 1</td>
                <td colspan="2">Personaje 2</td>
                
            </tr>
        </tbody>
        </table>
        <br>
        <br>
        </div>
        <br>
        <br>
        <div class="fondo-div2 tamano-div2">
            <form action="" method="POST">
                <label for="correo">Correo</label>
                <input type="email" name="correo"/>
                <br>
                <br>
                <label for="contrasena">Contraseña</label>
                <input type="password" name="contrasena"/>
                <br>
                <br>
                <button>Enviar</button>
                <br>
                <br>
                <label for="genero">Género</label>
                <select name="genero">
                    <option value="0">Mujer</option>
                    <option value="1">Hombre</option>
                    <option value="3">No binario</option>
                    <option value="4">British</option>
                </select>
                <br>
                <br>
                <label for="comentarios">Comentarios</label>
                <textarea name="comentarios"></textarea>
                <br>
                <br>
                <button>Enviar</button>
            </form>
        </div>
    </body>
</html>
