<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selección de Artistas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Selección de Artistas</h1>
            <div class="mb-3">
                <label for="tokenInput" class="form-label">Token de Spotify:</label>
                <input type="text" class="form-control" id="tokenInput" placeholder="Pega tu token aquí">
                <button id="guardarToken" class="btn btn-primary mt-2">Guardar Token</button>
            </div>

            <div class="mb-3">
                <label for="trackSelect" class="form-label">Selecciona una canción:</label>
                <select class="form-select" id="trackSelect">
                    <option value="6HU7h9RYOaPRFeh0R3UeAr">deja vu</option>
                    <option value="6De0lHrwBfPfrhorm9q1Xl">me reúso</option>
                    <option value="2lTm559tuIvatlT1u0JYG2">baile inolvidable</option>
                    <option value="7qnRFbDVUB3EkrfHYqzoNm">smoochie girl</option>
                </select>
            </div>
            <div class="mb-3">
                <button id="limpiar" class="btn btn-secondary mt-2">Limpiar</button>
            </div>
            <div class="mb-3" id="danger">
            </div>

            <div id="trackInfo"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
